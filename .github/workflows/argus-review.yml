name: Argus-Flash Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  review:
    # Dependabot PRs do not receive repository secrets, so the app-token step
    # always fails on them. Mirror the guard used by cgartlab/argus and
    # cgartlab/men review workflows.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate argus-flash token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ARGUS_FLASH_APP_ID }}
          private-key: ${{ secrets.ARGUS_FLASH_PRIVATE_KEY }}

      - uses: cgartlab/argus/.github/actions/argus-review@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
