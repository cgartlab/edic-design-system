name: CI

on:
  push:
    branches: [main, dev/*, fix/*, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Full 2.0 audit
        env:
          PYTHONIOENCODING: utf-8
          # release-please 分支 PR / `release-please--` 相关合并提交（merge 或 squash 形态）
          # 存在版本过渡态（tokens/package 已 bump、VERSION 待 post-merge-stamp 同步），
          # 按 AGENTS.md §3.1 跳过版本检查。`|| ''` 防止 push 事件下 null 求值失败。
          AUDIT_SKIP_VERSION_CHECKS: ${{ contains(github.event.head_commit.message || '', 'release-please--') || startsWith(github.head_ref || '', 'release-please--') }}
        run: npm run audit
      - name: Validate release notes exist
        if: github.head_ref != '' && contains(github.head_ref, 'release-please')
        run: python3 tools/validate_release_notes.py
      - name: Verify changelog.html is up to date
        # release-please 分支跳过：CHANGELOG.md 由 release-please 先行更新，changelog.html
        # 由合并后的 post-merge-stamp 重建（validate_release_notes.py 仍强制校验版本节存在）。
        if: ${{ !(startsWith(github.head_ref, 'release-please--') || contains(github.event.head_commit.message || '', 'release-please--')) }}
        run: python3 tools/generate_changelog_html.py --check