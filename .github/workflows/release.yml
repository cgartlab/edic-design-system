# EDIC Design System — Release Pipeline
# 构建 PDF + Skill ZIP + 完整发行 ZIP，上传到已由 release-please 创建的 GitHub Release
name: Release Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.10.0），紧急手动发布用"
        required: true
        type: string
      skip_validation:
        description: "⚠️ 跳过验证（仅限紧急热修复）"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── Guard：workflow_dispatch 若未提供 version 输入则立即失败 ──
      # version 已设为 required: true，GitHub UI 会强制填写；此步骤为双保险，
      # 防御通过 API 等方式绕过 UI 校验的场景。
      - name: Guard missing version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        run: |
          echo "::error::workflow_dispatch requires 'version' input"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Make scripts executable
        run: chmod +x tools/validate_*.py scripts/*.py scripts/*.sh 2>/dev/null || true

      # ── workflow_dispatch 手动指定版本：同步 VERSION 文件 ──
      # NOTE: must run AFTER checkout so the written files are not overwritten
      - name: Sync VERSION file (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ inputs.version }}"
          echo "$VERSION" > VERSION
          echo "VERSION file synced to v$VERSION"

          python3 -c "
          import json
          VERSION = '${VERSION}'
          for fname in ['tokens.json', 'package.json']:
              with open(fname, 'r+', encoding='utf-8') as f:
                  d = json.load(f)
                  d['version'] = VERSION
                  f.seek(0)
                  json.dump(d, f, indent=2, ensure_ascii=False)
                  f.truncate()
              print(f'  {fname}: synced to v{VERSION}')
          "

          python3 tools/stamp_version.py

      # ── release 事件下从 release tag 同步 VERSION ─────────────────
      # release-please 创建 tag 即 vX.Y.Z；VERSION 纯文本需显式同步
      - name: Sync VERSION from release tag
        if: ${{ github.event_name == 'release' }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_NUM="${TAG_NAME#v}"
          echo "Tag: $TAG_NAME → VERSION: $VERSION_NUM"
          printf '%s\n' "$VERSION_NUM" > VERSION
          cat VERSION

      - name: Clean assets directory
        run: rm -rf assets/downloads/*

      # ── Stamp first, then validate ─────────────────────────
      - name: Stamp version placeholders
        run: python3 tools/stamp_version.py

      # ── 版本一致性校验 ─────────────────────────────
      - name: Validate version consistency
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_validation }}
        run: |
          python3 tools/validate_versions.py || rc=$?; \
          if [ ${rc:-0} -eq 1 ]; then exit 1; elif [ ${rc:-0} -eq 2 ]; then exit 0; fi

      - name: Validate token/CSS consistency
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_validation }}
        run: |
          python3 tools/validate_tokens.py || rc=$?; \
          if [ ${rc:-0} -eq 1 ]; then exit 1; elif [ ${rc:-0} -eq 2 ]; then exit 0; fi

      # ── 生成图标精灵 ─────────────────────────────
      - name: Verify icons sprite
        run: python3 tools/generate_icons.py --check

      # ── 生成 PDF ─────────────────────────────────
      - name: Generate PDFs
        run: |
          mkdir -p assets/downloads
          python3 tools/generate_pdfs.py

      # ── 打包 Skill ZIP ───────────────────────────
      - name: Package AI Skill ZIP
        run: python3 scripts/package_skill.py

      # ── 打包完整发行 ZIP ─────────────────────────
      - name: Package distribution ZIP
        run: python3 scripts/package_release.py

      # ── 生成校验和 ────────────────────────────────
      - name: Generate checksums
        run: |
          cd assets/downloads
          sha256sum *.pdf *.zip > CHECKSUMS.txt
          echo "=== Checksums ==="
          cat CHECKSUMS.txt

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            assets/downloads/*.pdf
            assets/downloads/*.zip
            assets/downloads/CHECKSUMS.txt

      # ── 紧急回退：workflow_dispatch 若 release 尚不存在，先创建 ───────
      - name: Ensure release exists (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found — creating (emergency fallback)"
            gh release create "$TAG" --title "$TAG" --notes "Manual release $TAG"
          else
            echo "Release $TAG already exists"
          fi

      # ── 上传全部产物到已存在的 GitHub Release ────────────────────
      # release 事件下 tag 由 github.event.release.tag_name 提供；
      # workflow_dispatch 下用 inputs.version 拼接 vX.Y.Z。
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v${{ inputs.version }}"
          fi
          echo "Uploading assets to $TAG"
          gh release upload "$TAG" assets/downloads/*.pdf assets/downloads/*.zip assets/downloads/CHECKSUMS.txt --clobber

      # ── 验证资产 ─────────────────────────────────
      - name: Verify release assets
        run: |
          echo "=== Release artifacts ==="
          ls -lh assets/downloads/
          echo ""
          echo "=== Checksums ==="
          sha256sum assets/downloads/*.pdf assets/downloads/*.zip

      # ── Guard against orphaned 'untagged-' asset URLs ─────────────
      # When a release object loses its tag binding (e.g. tag deleted
      # and recreated), GitHub keeps the assets but serves them under
      # releases/download/untagged-<sha>/... instead of /vX.Y.Z/...
      # This step fails the pipeline if any asset URL is mis-bound so
      # the broken release cannot ship silently. See v1.8.1 incident.
      - name: Verify asset URLs are versioned (no 'untagged-' leak)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v${{ inputs.version }}"
          fi
          echo "=== Checking every asset URL contains tag '$TAG' ==="
          set +e
          BAD=0
          COUNT=0
          while IFS=$'\t' read -r name url; do
            [ -z "$url" ] && continue
            COUNT=$((COUNT + 1))
            if echo "$url" | grep -q "untagged-"; then
              echo "::error file=.github/workflows/release.yml::Asset '$name' has untagged URL: $url"
              BAD=1
            elif ! echo "$url" | grep -q "/$TAG/"; then
              echo "::error file=.github/workflows/release.yml::Asset '$name' URL missing tag '$TAG': $url"
              BAD=1
            else
              echo "OK  $name -> $url"
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.url)"')
          echo ""
          echo "Verified $COUNT assets."
          if [ "$BAD" -ne 0 ]; then
            echo "::error::Release was published with mis-bound asset URLs. Failing pipeline."
            echo "Hint: delete the release, ensure the tag is intact, then re-run the workflow."
            exit 1
          fi
          echo "All asset URLs are correctly bound to tag '$TAG'."

  # ── SkillHub 自动发布（参考 cgartlab/argus 同款接入）──────────────────────
  # slug = edic-design-system：SkillHub 已有同 ID 手动发布条目，
  # 同 slug 发布即覆盖更新。需仓库 secret SKILLHUB_API_KEY。
  skillhub:
    name: Publish to SkillHub
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ── VERSION 同步（与 build job 相同的两种事件路径）────────────────
      - name: Sync VERSION file (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: printf '%s\n' "${{ inputs.version }}" > VERSION

      - name: Sync VERSION from release tag
        if: github.event_name == 'release'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_NUM="${TAG_NAME#v}"
          echo "Tag: $TAG_NAME → VERSION: $VERSION_NUM"
          printf '%s\n' "$VERSION_NUM" > VERSION

      # SKILL.md version 必须等于 VERSION（publish_skillhub.py 会校验）
      - name: Stamp SKILL.md version from VERSION
        run: python3 tools/stamp_version.py

      # ── SkillHub CLI（先下载到临时文件再执行，避免 pipe-to-bash / CWE-494）──
      # skillhub.cn 不发布 checksum URL，暂无法完整校验；至少使脚本可审查。
      - name: Install SkillHub CLI
        run: |
          curl -fsSL https://skillhub.cn/install/install.sh -o /tmp/skillhub-install.sh
          test -s /tmp/skillhub-install.sh
          bash /tmp/skillhub-install.sh --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          skillhub --version

      - name: Build skill package
        run: python3 scripts/package_skill.py

      - name: Prepare SkillHub publish directory
        run: |
          VERSION=$(cat VERSION)
          python3 tools/publish_skillhub.py prepare \
            "assets/downloads/edic-design-system-skill-v${VERSION}.zip" \
            --out dist/skillhub-edic \
            --changelog-out dist/skillhub-changelog.txt

      - name: Login to SkillHub
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_API_KEY }}
        run: |
          if [ -z "$SKILLHUB_KEY" ]; then
            echo "::error::SKILLHUB_API_KEY secret is required"
            exit 1
          fi
          skillhub login --key "$SKILLHUB_KEY" --host "https://api.skillhub.cn"

      - name: Validate SkillHub publish payload (dry-run)
        run: skillhub publish dist/skillhub-edic --host "https://api.skillhub.cn" --dry-run

      - name: Publish Skill to SkillHub
        run: |
          skillhub publish dist/skillhub-edic \
            --host "https://api.skillhub.cn" \
            --changelog "$(cat dist/skillhub-changelog.txt)"
          echo "## SkillHub" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`edic-design-system@$(cat VERSION)\` to SkillHub (overwrite of existing entry)." >> "$GITHUB_STEP_SUMMARY"

  # ── ClawHub 自动发布（参考 cgartlab/argus 同款接入）────────────────────────
  # slug = edic-design-system（唯一发布 ID，publish_clawhub.py 硬校验防搞错）。
  # owner 取仓库变量 CLAWHUB_OWNER（未设置时省略 --owner，按 token 账号命名空间发布）。
  # 需仓库 secret CLAWHUB_TOKEN（clh_... API token）。--changelog 传阅读友好更新摘要。
  clawhub:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ── VERSION 同步（与 build job 相同的两种事件路径）────────────────
      - name: Sync VERSION file (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: printf '%s\n' "${{ inputs.version }}" > VERSION

      - name: Sync VERSION from release tag
        if: github.event_name == 'release'
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_NUM="${TAG_NAME#v}"
          echo "Tag: $TAG_NAME → VERSION: $VERSION_NUM"
          printf '%s\n' "$VERSION_NUM" > VERSION

      # SKILL.md version 必须等于 VERSION（publish_clawhub.py 会校验）
      - name: Stamp SKILL.md version from VERSION
        run: python3 tools/stamp_version.py

      - name: Install ClawHub CLI
        # Pin via @latest (v0.7.1+ 修复了 acceptLicenseTerms 缺失导致的发布失败)
        run: |
          npm install -g clawhub@latest
          clawhub -V

      - name: Build skill package
        run: python3 scripts/package_skill.py

      - name: Prepare ClawHub publish directory
        run: |
          VERSION=$(cat VERSION)
          python3 tools/publish_clawhub.py prepare \
            "assets/downloads/edic-design-system-skill-v${VERSION}.zip" \
            --out dist/clawhub-edic \
            --changelog-out dist/clawhub-changelog.txt

      - name: Login to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret is required"
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub whoami

      - name: Validate ClawHub publish payload (dry-run)
        run: |
          VERSION=$(cat VERSION)
          OWNER_ARG=""
          if [ -n "${{ vars.CLAWHUB_OWNER }}" ]; then
            OWNER_ARG="--owner ${{ vars.CLAWHUB_OWNER }}"
          fi
          clawhub skill publish dist/clawhub-edic \
            --slug edic-design-system \
            --name "EDIC 设计系统" \
            --version "$VERSION" \
            --changelog "$(cat dist/clawhub-changelog.txt)" \
            --source-repo "cgartlab/edic-design-system" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            $OWNER_ARG \
            --dry-run

      - name: Publish Skill to ClawHub
        run: |
          VERSION=$(cat VERSION)
          OWNER_ARG=""
          if [ -n "${{ vars.CLAWHUB_OWNER }}" ]; then
            OWNER_ARG="--owner ${{ vars.CLAWHUB_OWNER }}"
          fi
          clawhub skill publish dist/clawhub-edic \
            --slug edic-design-system \
            --name "EDIC 设计系统" \
            --version "$VERSION" \
            --changelog "$(cat dist/clawhub-changelog.txt)" \
            --source-repo "cgartlab/edic-design-system" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            $OWNER_ARG
          echo "## ClawHub" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`edic-design-system@$(cat VERSION)\` to ClawHub with a reader-friendly changelog summary." >> "$GITHUB_STEP_SUMMARY"