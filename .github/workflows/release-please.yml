# EDIC Design System — Release Please Workflow
#
# ── 策略：手工 tag 触发正式发布 ──────────────────────────────────────────────
#
# release-please 只负责两件事：
#   1. 分析 Conventional Commits，自动创建/更新 Release PR
#      （含版本号 bump、CHANGELOG.md 更新）
#   2. Release PR 合并后 post-merge-stamp 同步所有 HTML/MD 的 ?v= 缓存戳
#      并自动更新网站 changelog.html 的可见内容
#
# release-please 【不会】自动打 tag，【不会】自动触发 release 流水线。
# 只有人类明确执行 `git tag vX.Y.Z && git push origin vX.Y.Z` 之后，
# release.yml 才会触发，构建资产并创建 GitHub Release。
#
# 完整发布流程见 docs/RELEASE-CHECKLIST.md。
#
# 触发方式：
#   push to main       → 自动分析 commits，创建/更新 Release PR
#   workflow_dispatch   → 手动触发，可强制版本号或标记预发布
#
# 前置条件：
#   - secrets.RELEASE_PLEASE_TOKEN 已配置（Fine-grained PAT）
#   - main 分支已配置 Branch Protection（Validate 检查 + github-actions[bot] 绕过审批）
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: "强制版本号（例如 1.6.0），覆盖 release-please 自动计算"
        required: false
        type: string
      prerelease:
        description: "标记为预发布版本"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false  # 不要取消进行中的 release

jobs:
  release-please:
    name: Create/Update Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要完整 git 历史用于 Conventional Commits 分析

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release-as }}
          prerelease: ${{ inputs.prerelease }}
          # ── 全自动发布：Release PR 合并后自动创建 GitHub Release + tag ──
          # release-please 负责 Release PR + CHANGELOG 更新 + 创建 GitHub Release。
          # tag 创建后触发 release.yml（push: tags/v*），自动构建资产并发布。
          skip-github-release: "true"

      - name: Show release result
        if: steps.rp.outputs.release_created == 'true'
        run: |
          echo "Release created: ${{ steps.rp.outputs.tag_name }}"
          echo "Version: ${{ steps.rp.outputs.version }}"

      - name: No release needed
        if: steps.rp.outputs.release_created != 'true'
        run: |
          echo "No releasable commits since last release."
          echo "Release PR may have been updated even without a new release."

  # ── post-merge-stamp ─────────────────────────────────────────
  # Release PR 合并后自动完成两件事：
  #   1. 同步 VERSION → 所有 HTML/MD 的 ?v= 缓存戳（stamp_version.py）
  #   2. 从 CHANGELOG.md 单源重建网站变更页（generate_changelog_html.py）
  #
  # 此 job 完成后，main 分支上的网站已完全同步到新版本，
  # 人类可以在任意时间执行：
  #   git tag vX.Y.Z && git push origin vX.Y.Z
  # 来触发 release.yml 构建资产并创建 GitHub Release。
  post-merge-stamp:
    name: Stamp HTML/MD after Release PR merge
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Sync VERSION to the released version BEFORE stamping ─────
      # release-please updates VERSION via extra-files (see
      # release-please-config.json), but in case it didn't (or was
      # skipped), we re-write VERSION here from the release-please
      # output. Without this guard, stamp_version.py reads the stale
      # VERSION and uses replace_old_version() to revert the just-
      # released version in package.json / tokens.json back to the
      # old one (v1.6.0 → v1.5.5 bug, see commit ed3cc03).
      - name: Sync VERSION from release-please output
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          echo "Released version: v${VERSION}"
          printf '%s\n' "$VERSION" > VERSION
          cat VERSION

      - name: Run stamp_version.py
        run: python3 tools/stamp_version.py

      - name: Rebuild changelog.html from CHANGELOG.md
        run: |
          python3 tools/generate_changelog_html.py
          echo "changelog.html rebuilt from CHANGELOG.md (single source)"

      - name: Commit stamp drift (if any)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 检查是否有未提交的变更
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Stamping changed HTML/MD files — committing with [skip ci]"
            git add -A
            git commit -m "chore(release): post-merge stamp to v${{ needs.release-please.outputs.version }} [skip ci]"
            git push
          else
            echo "No stamp drift — all HTML/MD files already up to date."
          fi

      - name: Alert on post-merge-stamp failure
        if: failure()
        run: |
          echo "## ⚠️ POST-MERGE-STAMP FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**`post-merge-stamp` failed to sync VERSION and stamp HTML/MD files on main.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This means main branch still has the OLD version (`VERSION` file). All subsequent stamps and asset builds will use the wrong version." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action required:** Manually run the `post-merge-stamp` job or fix the VERSION file on main." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If this job fails repeatedly, check:" >> $GITHUB_STEP_SUMMARY
          echo "1. `RELEASE_PLEASE_TOKEN` has not expired" >> $GITHUB_STEP_SUMMARY
          echo "2. No git conflicts on main" >> $GITHUB_STEP_SUMMARY
          echo "3. Network connectivity to GitHub" >> $GITHUB_STEP_SUMMARY
          exit 1
