name: CI

on:
  push:
    branches: [main, dev/*, fix/*, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Full 2.0 audit
        env:
          PYTHONIOENCODING: utf-8
        run: npm run audit
      - name: Validate release notes exist
        if: github.head_ref != '' && contains(github.head_ref, 'release-please')
        run: python3 tools/validate_release_notes.py
      - name: Verify changelog.html is up to date
        if: always()
        run: python3 tools/generate_changelog_html.py --check