# EDIC Design System — Release Please Workflow
#
# 基于 Conventional Commits 自动创建 Release PR。
# 合并后自动打 tag → 触发 release.yml 构建资产并创建 GitHub Release。
#
# 触发方式：
#   push to main       → 自动分析 commits，创建/更新 Release PR
#   workflow_dispatch   → 手动触发，可强制版本号或标记预发布
#
# 前置条件（Phase 4 完成）：
#   - secrets.RELEASE_PLEASE_TOKEN 已配置（Fine-grained PAT）
#   - main 分支已配置 Branch Protection（Validate 检查 + github-actions[bot] 绕过审批）
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: "强制版本号（例如 1.6.0），覆盖 release-please 自动计算"
        required: false
        type: string
      prerelease:
        description: "标记为预发布版本"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false  # 不要取消进行中的 release

jobs:
  release-please:
    name: Create/Update Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要完整 git 历史用于 Conventional Commits 分析

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release-as }}
          prerelease: ${{ inputs.prerelease }}

      - name: Show release result
        if: steps.rp.outputs.release_created == 'true'
        run: |
          echo "Release created: ${{ steps.rp.outputs.tag_name }}"
          echo "Version: ${{ steps.rp.outputs.version }}"

      - name: No release needed
        if: steps.rp.outputs.release_created != 'true'
        run: |
          echo "No releasable commits since last release."
          echo "Release PR may have been updated even without a new release."

  # ── post-merge-stamp ─────────────────────────────────────────
  # 在 Release PR 合并后、tag push 之前，确保 main 分支上的 HTML/MD
  # 文件已被 stamp（VERSION 已由 release-please 在 PR 中更新）。
  # 这样 release.yml 的 tag push 触发时，main 上的 ?v= 已经是最新的。
  post-merge-stamp:
    name: Stamp HTML/MD after Release PR merge
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run stamp_version.py
        run: python3 tools/stamp_version.py

      - name: Commit stamp drift (if any)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 检查是否有未提交的变更
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Stamping changed HTML/MD files — committing with [skip ci]"
            git add -A
            git commit -m "chore(release): post-merge stamp to v${{ needs.release-please.outputs.version }} [skip ci]"
            git push
          else
            echo "No stamp drift — all HTML/MD files already up to date."
          fi
