# EDIC Design System — Release Please Workflow
#
# ── 策略：release-please 自动 tag + GitHub Release ──────────────────────────
#
# release-please 负责：
#   1. 分析 Conventional Commits，自动创建/更新 Release PR
#      （含版本号 bump、CHANGELOG.md 更新）
#   2. Release PR 合并后，release-please-action 自动创建 tag + GitHub Release
#      （GitHub 后台签名，无需本地 GPG）
#   3. post-merge-stamp 同步 VERSION / HTML/MD 的 ?v= 缓存戳
#      并重建 changelog.html
#
# release.yml 由 release 事件触发，构建资产并上传到已存在的 GitHub Release。
#
# 完整发布流程见 docs/RELEASE-CHECKLIST.md。
#
# 触发方式：
#   push to main       → 自动分析 commits，创建/更新 Release PR
#   workflow_dispatch   → 手动触发，可强制版本号
#
# 前置条件：
#   - secrets.RELEASE_PLEASE_TOKEN 已配置（Fine-grained PAT）
#   - main 分支已配置 Branch Protection（Validate 检查 + github-actions[bot] 绕过审批）
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: "强制版本号（例如 1.6.0），覆盖 release-please 自动计算"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false  # 不要取消进行中的 release

jobs:
  release-please:
    name: Create/Update Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要完整 git 历史用于 Conventional Commits 分析

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release-as }}
          # skip-github-release 默认 false：Release PR 合并后自动创建 tag + GitHub Release
          # （GitHub 后台签名，无需本地 GPG）

      - name: Show release result
        if: steps.rp.outputs.release_created == 'true'
        run: |
          echo "Release created: v${{ steps.rp.outputs.version }}"

      - name: No release created
        if: steps.rp.outputs.release_created != 'true'
        run: |
          echo "No release created this run (Release PR may be pending review)."

  # ── post-merge-stamp ─────────────────────────────────────────
  # skip=false 时 release-please-action 会在 Release PR 合并后自动创建 tag +
  # GitHub Release，并输出 release_created=true。本 job 通过 gate 仅在该 output
  # 为 true 时运行，从 output 同步 VERSION，然后 stamp HTML/MD 并重建 changelog.html。
  #
  # 注意：VERSION 纯文本文件因无 x-release-please-version 标注，
  # GenericUpdater 无法更新它（见 release-please src/updaters/generic.ts），
  # 因此需要从 release-please output 同步 VERSION。
  post-merge-stamp:
    name: Stamp HTML/MD after release
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 从 release-please output 同步 VERSION 文件（GenericUpdater 无法更新纯文本 VERSION）──
      - name: Sync VERSION from release-please output
        run: |
          printf '%s\n' "${{ needs.release-please.outputs.version }}" > VERSION
          cat VERSION

      - name: Run stamp_version.py
        run: python3 tools/stamp_version.py

      - name: Rebuild changelog.html from CHANGELOG.md
        run: |
          python3 tools/generate_changelog_html.py
          echo "changelog.html rebuilt from CHANGELOG.md (single source)"

      - name: Commit stamp drift (if any)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Stamping changed HTML/MD files — committing with [skip ci]"
            git add -A
            git commit -m "chore(release): post-merge stamp to v$(cat VERSION) [skip ci]"
            git push
          else
            echo "No stamp drift — all HTML/MD files already up to date."
          fi

      - name: Alert on post-merge-stamp failure
        if: failure()
        run: |
          echo "## ⚠️ POST-MERGE-STAMP FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**\`post-merge-stamp\` failed to stamp HTML/MD files on main.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action required:** Manually run \`python3 tools/stamp_version.py\` on main." >> $GITHUB_STEP_SUMMARY
          exit 1
