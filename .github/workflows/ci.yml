name: CI

on:
  push:
    branches: [main, dev/*, fix/*, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Full 2.0 audit
        env:
          PYTHONIOENCODING: utf-8
          # release-please 分支 / `chore(main): release` 合并提交存在版本过渡态
          # （tokens/package 已 bump、VERSION 待 post-merge-stamp 同步），按 AGENTS.md §3.1 跳过版本检查。
          AUDIT_SKIP_VERSION_CHECKS: ${{ startsWith(github.head_ref, 'release-please--') || startsWith(github.event.head_commit.message || '', 'chore(main): release') }}
        run: npm run audit
      - name: Validate release notes exist
        if: github.head_ref != '' && contains(github.head_ref, 'release-please')
        run: python3 tools/validate_release_notes.py
      - name: Verify changelog.html is up to date
        if: always()
        run: python3 tools/generate_changelog_html.py --check