# EDIC Design System — Release Please Workflow
#
# ── 策略：手工 tag 触发正式发布 ──────────────────────────────────────────────
#
# release-please 只负责两件事：
#   1. 分析 Conventional Commits，自动创建/更新 Release PR
#      （含版本号 bump、CHANGELOG.md 更新）
#   2. Release PR 合并后 post-merge-stamp 同步所有 HTML/MD 的 ?v= 缓存戳
#      并自动更新网站 changelog.html 的可见内容
#
# release-please 【不会】自动打 tag，【不会】自动触发 release 流水线。
# 只有人类明确执行 `git tag vX.Y.Z && git push origin vX.Y.Z` 之后，
# release.yml 才会触发，构建资产并创建 GitHub Release。
#
# 完整发布流程见 docs/RELEASE-CHECKLIST.md。
#
# 触发方式：
#   push to main       → 自动分析 commits，创建/更新 Release PR
#   workflow_dispatch   → 手动触发，可强制版本号或标记预发布
#
# 前置条件：
#   - secrets.RELEASE_PLEASE_TOKEN 已配置（Fine-grained PAT）
#   - main 分支已配置 Branch Protection（Validate 检查 + github-actions[bot] 绕过审批）
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: "强制版本号（例如 1.6.0），覆盖 release-please 自动计算"
        required: false
        type: string
      prerelease:
        description: "标记为预发布版本"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false  # 不要取消进行中的 release

jobs:
  release-please:
    name: Create/Update Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要完整 git 历史用于 Conventional Commits 分析

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release-as }}
          prerelease: ${{ inputs.prerelease }}
          # ── 手工 tag 发布：release-please 仅创建/更新 Release PR ──
          # tag 由人类 `git tag -s vX.Y.Z && git push origin vX.Y.Z` 创建，
          # release.yml（push: tags/v*）随后构建资产并创建 GitHub Release。
          # 注意：skip-github-release: true 时 release-please-action 不设置
          # release_created / tag_name / version outputs（见 action 源码 src/index.ts），
          # 因此 post-merge-stamp 依赖检测 .release-please-manifest.json 变化来触发，
          skip-github-release: "true"

      - name: Show release PR result
        if: steps.rp.outputs.prs_created == 'true'
        run: |
          echo "Release PR created/updated: ${{ steps.rp.outputs.pr }}"

      - name: No release PR needed
        if: steps.rp.outputs.prs_created != 'true'
        run: |
          echo "No releasable commits since last release."

  # ── post-merge-stamp ─────────────────────────────────────────
  # skip-github-release: true 时 release-please-action 不输出
  # release_created/version（见 action 源码 src/index.ts），
  # 因此改为检测 .release-please-manifest.json 变化来触发 stamp。
  #
  # Release PR 合并后 manifest 被更新（release-please 唯一保证更新的文件），
  # 本 job 遍历提交范围检测 manifest 版本变化，若变化则同步 VERSION 并 stamp。
  #
  # 注意：VERSION 纯文本文件因无 x-release-please-version 标注，
  # GenericUpdater 无法更新它（见 release-please src/updaters/generic.ts），
  # 因此需要从 manifest 反向同步 VERSION。
  post-merge-stamp:
    name: Stamp HTML/MD after Release PR merge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 检测版本变化（manifest vs VERSION 直接对比，幂等可自愈）──
      # VERSION 纯文本因无 x-release-please-version 标注，GenericUpdater 无法更新，
      # 因此以 .release-please-manifest.json 为版本变化的可靠信号。
      # 直接对比 manifest 与 VERSION：只要二者漂移即为版本变化（Release PR 合并
      # 后 manifest 更新、VERSION 未同步 → 必然触发），无需关心提交拓扑或 push 批次。
      # 失败时 fail-closed（exit 1），由下方 Alert 步骤告警。
      - name: Detect version bump (via manifest)
        id: detect
        run: |
          set -e
          MANIFEST_VER="$(python3 -c 'import json;print(json.load(open(".release-please-manifest.json"))["."])' 2>/dev/null || echo '')"
          if [[ -z "$MANIFEST_VER" ]]; then
            echo "::error::Cannot read .release-please-manifest.json version"
            exit 1
          fi
          CURRENT_VER="$(cat VERSION 2>/dev/null || echo '')"
          if [[ -n "$CURRENT_VER" && "$MANIFEST_VER" != "$CURRENT_VER" ]]; then
            echo "VERSION drift: manifest=$MANIFEST_VER VERSION=$CURRENT_VER"
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "version=$MANIFEST_VER" >> "$GITHUB_OUTPUT"
          else
            echo "No version drift (both $MANIFEST_VER)"
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 从 manifest 同步 VERSION 文件（GenericUpdater 无法更新纯文本 VERSION）──
      - name: Sync VERSION from manifest
        if: steps.detect.outputs.detected == 'true'
        run: |
          printf '%s\n' "${{ steps.detect.outputs.version }}" > VERSION
          cat VERSION

      - name: Run stamp_version.py
        if: steps.detect.outputs.detected == 'true'
        run: python3 tools/stamp_version.py

      - name: Rebuild changelog.html from CHANGELOG.md
        if: steps.detect.outputs.detected == 'true'
        run: |
          python3 tools/generate_changelog_html.py
          echo "changelog.html rebuilt from CHANGELOG.md (single source)"

      - name: Commit stamp drift (if any)
        if: steps.detect.outputs.detected == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Stamping changed HTML/MD files — committing with [skip ci]"
            git add -A
            git commit -m "chore(release): post-merge stamp to v$(cat VERSION) [skip ci]"
            git push
          else
            echo "No stamp drift — all HTML/MD files already up to date."
          fi

      - name: Alert on post-merge-stamp failure
        if: failure()
        run: |
          echo "## ⚠️ POST-MERGE-STAMP FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**\`post-merge-stamp\` failed to stamp HTML/MD files on main.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action required:** Manually run \`python3 tools/stamp_version.py\` on main." >> $GITHUB_STEP_SUMMARY
          exit 1
