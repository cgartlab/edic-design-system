# EDIC Design System — Release Pipeline
# 构建 PDF + Skill ZIP + 完整发行 ZIP，附加到 GitHub Release
name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.6.0），与 VERSION 文件同步（紧急手动发布用）"
        required: false
        type: string
      skip_validation:
        description: "⚠️ 跳过验证步骤（仅限紧急热修复，可能导致发布含破坏性变更）"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make scripts executable
        run: chmod +x tools/validate_*.py scripts/*.py scripts/*.sh 2>/dev/null || true

      # ── workflow_dispatch 手动指定版本：同步 VERSION 文件 ──
      # NOTE: must run AFTER checkout so the written files are not overwritten
      - name: Sync VERSION file (manual dispatch)
        if: inputs.version != ''
        run: |
          VERSION="${{ inputs.version }}"
          echo "$VERSION" > VERSION
          echo "VERSION file synced to v$VERSION"

          # 同步 tokens.json 和 package.json
          python3 -c "
          import json
          VERSION = '${VERSION}'
          for fname in ['tokens.json', 'package.json']:
              with open(fname, 'r+', encoding='utf-8') as f:
                  d = json.load(f)
                  d['version'] = VERSION
                  f.seek(0)
                  json.dump(d, f, indent=2, ensure_ascii=False)
                  f.truncate()
              print(f'  {fname}: synced to v{VERSION}')
          "

          # 调用 stamp_version.py
          python3 tools/stamp_version.py

      # ── Sync VERSION from tag name ─────────────────────────────────
      # release-please's generic updater doesn't update the plain-text VERSION
      # file (needs x-release-please-version annotation). The tag IS the source
      # of truth here, so overwrite VERSION with the tag-derived version.
      - name: Sync VERSION from tag name
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION_NUM="${TAG_NAME#v}"
          echo "Tag: $TAG_NAME → VERSION: $VERSION_NUM"
          printf '%s\n' "$VERSION_NUM" > VERSION
          cat VERSION

      - name: Clean assets directory
        run: rm -rf assets/downloads/*

      # ── Stamp first, then validate ─────────────────────────
      # Tag push is the source of truth — stamp updates ?v= before validation
      - name: Stamp version placeholders
        run: python3 tools/stamp_version.py

      # ── 版本一致性校验 ─────────────────────────────
      - name: Validate version consistency
        if: inputs.skip_validation != 'true'
        run: |
          python3 tools/validate_versions.py || rc=$?; \
          if [ ${rc:-0} -eq 1 ]; then exit 1; elif [ ${rc:-0} -eq 2 ]; then exit 0; fi

      - name: Validate token/CSS consistency
        if: inputs.skip_validation != 'true'
        run: |
          python3 tools/validate_tokens.py || rc=$?; \
          if [ ${rc:-0} -eq 1 ]; then exit 1; elif [ ${rc:-0} -eq 2 ]; then exit 0; fi

      # ── 生成图标精灵 ─────────────────────────────
      - name: Verify icons sprite
        run: python3 tools/generate_icons.py --check

      # ── 生成 PDF ─────────────────────────────────
      - name: Generate PDFs
        run: |
          mkdir -p assets/downloads
          python3 tools/generate_pdfs.py

      # ── 打包 Skill ZIP ───────────────────────────
      - name: Package AI Skill ZIP
        run: python3 scripts/package_skill.py

      # ── 打包完整发行 ZIP ─────────────────────────
      - name: Package distribution ZIP
        run: python3 scripts/package_release.py

      # ── 生成校验和 ────────────────────────────────
      - name: Generate checksums
        run: |
          cd assets/downloads
          sha256sum *.pdf *.zip > CHECKSUMS.txt
          echo "=== Checksums ==="
          cat CHECKSUMS.txt

      # ── 上传全部产物 ─────────────────────────────
      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            assets/downloads/*.pdf
            assets/downloads/*.zip
            assets/downloads/CHECKSUMS.txt
          retention-days: 90

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets/downloads/

      - name: Extract changelog for release notes
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 从 tag 名称提取版本号（去掉 'v' 前缀）
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # 使用 stamp_version.py 提取 Keep a Changelog 格式的 section
          NOTES=$(python3 tools/stamp_version.py --changelog-section "$VERSION" 2>/dev/null || echo "")
          if [ -n "$NOTES" ]; then
            printf 'RELEASE_NOTES<<EOF\n%s\nEOF\n' "$NOTES" >> $GITHUB_OUTPUT
          else
            # 回退：输出空，让 GitHub Release 使用自动生成备注
            printf 'RELEASE_NOTES<<EOF\nEOF\n' >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.changelog.outputs.RELEASE_NOTES }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -e
          # ── 幂等创建：已存在则编辑，不存在则创建 ──────────────
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — editing in place"
            gh release edit "$TAG" --title "$TAG" --notes "$BODY" --prerelease="$PRERELEASE"
            gh release upload "$TAG" assets/downloads/*.pdf assets/downloads/*.zip assets/downloads/CHECKSUMS.txt --clobber
          else
            echo "Release $TAG does not exist — creating"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$BODY" \
              --prerelease="$PRERELEASE" \
              --draft=true \
              assets/downloads/*.pdf \
              assets/downloads/*.zip \
              assets/downloads/CHECKSUMS.txt
          fi

      - name: Verify release assets
        run: |
          echo "=== Release artifacts ==="
          ls -lh assets/downloads/
          echo ""
          echo "=== Checksums ==="
          sha256sum assets/downloads/*.pdf assets/downloads/*.zip

      # ── 资产全部上传完毕后，将 Draft 转为正式发布 ────────────
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
        working-directory: assets/downloads

      # ── Guard against orphaned 'untagged-' asset URLs ─────────────
      # When a release object loses its tag binding (e.g. tag deleted
      # and recreated), GitHub keeps the assets but serves them under
      # releases/download/untagged-<sha>/... instead of /vX.Y.Z/...
      # This step fails the pipeline if any asset URL is mis-bound so
      # the broken release cannot ship silently. See v1.8.1 incident.
      - name: Verify asset URLs are versioned (no 'untagged-' leak)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "=== Checking every asset URL contains tag '$TAG' ==="
          set +e
          BAD=0
          COUNT=0
          while IFS=$'\t' read -r name url; do
            [ -z "$url" ] && continue
            COUNT=$((COUNT + 1))
            if echo "$url" | grep -q "untagged-"; then
              echo "::error file=.github/workflows/release.yml::Asset '$name' has untagged URL: $url"
              BAD=1
            elif ! echo "$url" | grep -q "/$TAG/"; then
              echo "::error file=.github/workflows/release.yml::Asset '$name' URL missing tag '$TAG': $url"
              BAD=1
            else
              echo "OK  $name -> $url"
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.url)"')
          echo ""
          echo "Verified $COUNT assets."
          if [ "$BAD" -ne 0 ]; then
            echo "::error::Release was published with mis-bound asset URLs. Failing pipeline."
            echo "Hint: delete the release, ensure the tag is intact, then re-run the workflow."
            exit 1
          fi
          echo "All asset URLs are correctly bound to tag '$TAG'."